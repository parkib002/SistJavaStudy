<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dongle&family=Nanum+Brush+Script&family=Orbit&family=Song+Myung&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<title>Insert title here</title>
<script type="text/javascript">
$(function(){
	
	//시작시 댓글 출력
	comment_list();
	
	//insert
	$("#btncommentsend").click(function(){
		
		let num=[[${dto.num}]];
		let comment=$("#comment").val();
		
		$.ajax({
			
			type:"get",
			url:"./addcomment",
			dataType:"html",
			data:{"num":num,"comment":comment},
			success:function(){
				
				comment_list();
				
				$("#comment").val('');
			}
		})
	});
});

function comment_list()
{
	let num=[[${dto.num}]];
	
	$.ajax({
		
		type:"get",
		dataType:"json",
		url:"./commentlist",
		data:{"num":num},
		success:function(res){
			
			let s=`댓글 &nbsp;${res.length}개`;
			
			$.each(res,function(idx,item){
				
				s+=`
					<div style="margin-left:20px;">
					${item.comment}
					<span style='color:gray; font-size:0.9em;'>
					${item.writeday}
					</span>
					</div>
					`;
			});
			
			$(".comment-list").html(s);
			
		}
		
	})
}
</script>
</head>
<body>
<div layout:fragment="content" class="content">

 <h3 class="alert alert-info" style="width: 600px;">[[${dto.carname}]] 상세보기</h3>
	<div>
			<img th:src="@{/carsave/{file}(file=${dto.carphoto})}" width="150" style="margin-bottom: 20px;">
				<h5>자동차명: [[${dto.carname}]]</h5><br>
				<h5>가격: [[${dto.carprice}]]</h5><br>
				<div th:style="'background-color:' + ${dto.carcolor}">
				색상: [[${dto.carcolor}]]
				</div><br>
				<h5>입고일: [[${dto.guipday}]]</h5><br>
				<h5>
					<span th:text="${#calendars.format(dto.writeday,'yyyy-MM-dd HH:mm')}"></span>
				</h5><br>
				
				<!-- 댓글 -->
				<div class="comment-list">
					댓글리스트
				</div>
				
				<br>
				
				<div class="input-group">
					<input type="text" class="form-control" id="comment"
					style="width: 300px;">&nbsp;&nbsp;&nbsp;
					<button type="button" class="btn btn-outline-success"
					id="btncommentsend">저장</button>
				</div>			
				
				<br>
				
				<button type="button" class="btn btn-outline-info" onclick="location.href='list'">목록</button>	
				<button type="button" class="btn btn-outline-primary" onclick="location.href='addform'">등록</button>	
				<button type="button" class="btn btn-outline-secondary" th:onclick="|location.href='@{./carupdate(num=${dto.num})}'|">수정</button>				
				<button type="button" class="btn btn-outline-danger" th:onclick="|location.href='@{./delete(num=${dto.num})}'|">삭제</button>
	</div>
</div>
</body>
</html>
