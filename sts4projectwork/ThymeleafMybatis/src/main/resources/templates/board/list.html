<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dongle&family=Nanum+Brush+Script&family=Orbit&family=Song+Myung&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<title>Insert title here</title>
</head>
<body>
<div layout:fragment="content" class="content">


		<div class="alert alert-info" style="width: 800px;">
			<b>총 [[${totalCount }]]개의 차량이 등록되어 있습니다</b>
		</div>

				<span style="float: right;">
					<button type="button" class="btn btn-outline-info"
						onclick="location.href='addform'" style="margin-bottom: 20px;">차량등록</button>
				</span>

			<table class="table table-bordered" style="width: 800px;">
				<thead>
					<tr class="table-warning">
						<th>번호</th>
						<th>자동차명</th>
						<th>색상</th>
						<th>가격</th>
						<th>구입일</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="car, status : ${list}" valign="middle">
						<td th:text="${status.index + 1}"></td>
						<td><a th:href="@{/board/detail(num=${car.num})}">[[${car.carname}]]</a></td>
						<td th:style="'background-color:' + ${car.carcolor}"></td>
						<td th:text="${#numbers.formatInteger(car.carprice,0,'COMMA')}"></td>
						<td th:text="${car.guipday}"></td>
					</tr>
				</tbody>
			</table>



	</div>
</body>
</html>
