<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dongle&family=Nanum+Brush+Script&family=Orbit&family=Song+Myung&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<title>Insert title here</title>
<script type="text/javascript">
$(function(){
	
	//버튼 클릭시 사진을 불러오기
	$("#btnphoto").click(function(){
				
		$("#myphoto").trigger("click");
	})
	//사진을 불러오면 이미지 미리보기
	$("#myphoto").change(function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            
            reader.onload = function(event) {
                $("#showimg").attr("src", event.target.result);
            };
            
            reader.readAsDataURL(file);
        }

	});
})
</script>
</head>
<body>
	
	<form action="insert" method="post" enctype="multipart/form-data">
		<table class="table table-bordered" style="width: 600px;">
			<caption align="top"><b>상품추가</b></caption>
			<tr>
				<td style="width: 250px;" rowspan="4" align="center" valign="bottom">
					<br>
					<img alt="" src="/avata/noimage.jpeg" id="showimg" style="width: 150px; height: 120px;">
					<input type="file" id="myphoto" name="upload" style="display: none;">
					<br>
					<button type="button" id="btnphoto"
					class="btn btn-outline-secondary" style="margin-top: 10px;">상품사진</button>
				</td>
				<td class="input-group">
					<input type="text" placeholder="상품명"
					name="sangpum" class="form-control" style="width: 120px;" required="required">
			</tr>
			
			<tr>
				<td class="input-group">
					<input type="text" style="width: 120px;" class="form-control" name="price"
					placeholder="가격" required="required">
				</td> 
			</tr>
			
			<tr>
				<td align="center">
					<input type="color" name="color" style="width: 120px;" class="form-control"
					required="required" value="#aaa">
				</td>
			</tr>
			
			<tr>
				<td align="center">
					<input type="date" name="ipgoday" style="width: 120px;" class="form-control"
					required="required" value="2025-07-11">
				</td>
			</tr>
			
			
			<tr>
				<td colspan="2" align="center">
					<input type="submit" class="btn btn-outline-primary" value="상품추가" style="width: 200px;">	
				</td>
			</tr>
		</table>
	</form>
</div>
</body>
</html>
